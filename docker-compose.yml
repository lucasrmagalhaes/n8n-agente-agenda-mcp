# n8n self-hosted para o agente de agenda.
# Canal stable em 23/10/2026: 2.44.6 (os typeVersions deste exemplo também existem no beta 2.45.3).
# Uso pessoal/interno é gratuito sob a Sustainable Use License da n8n.
# https://docs.n8n.io/sustainable-use-license/

services:
  n8n:
    image: n8nio/n8n:2.44.6
    restart: unless-stopped
    ports:
      # Só na máquina local. O MCP deste exemplo não tem autenticação.
      - "127.0.0.1:5678:5678"
    environment:
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
      TZ: ${TZ:-America/Sao_Paulo}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678/}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-troque-esta-chave-antes-de-criar-credenciais}
      # Cookie seguro exige HTTPS. Neste exemplo local o acesso é HTTP.
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Alternativa 100% local ao Gemini. Não sobe no `docker compose up` comum.
  # Suba com: docker compose --profile ollama up -d
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  n8n_data:
  ollama_data:
